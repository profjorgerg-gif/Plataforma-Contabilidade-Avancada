name: Ajustar texto da recuperacao

on:
  push:
    paths:
      - '.github/workflows/fix-recovery-note.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Ajustar texto
        run: python .github/scripts/fix_recovery_note.py
      - name: Validar JavaScript
        run: node --check public/app.js
      - name: Commit
        run: |
          git config user.name 'Projetos Pedagogicos'
          git config user.email 'profjorge.rg@gmail.com'
          git add public/app.js
          git commit -m 'Alinha texto da recuperação à regra de cálculo'
          git push
