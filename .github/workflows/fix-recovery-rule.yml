name: Ajustar regra da recuperacao

on:
  push:
    paths:
      - '.github/workflows/fix-recovery-rule.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar regra correta da recuperacao
        run: python .github/scripts/fix_recovery_rule.py

      - name: Validar JavaScript
        run: node --check public/app.js

      - name: Commit da correcao
        run: |
          git config user.name 'Projetos Pedagogicos'
          git config user.email 'profjorge.rg@gmail.com'
          git add public/app.js
          git commit -m 'Corrige regra de substituicao pela recuperacao'
          git push
