name: Implantar Guia Pedagogico
on:
  push:
    paths:
      - '.github/workflows/implement-guia-pedagogico.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar Guia Pedagógico
        run: python .github/scripts/implement_guia_pedagogico.py
      - name: Validar JavaScript
        run: node --check public/app.js
      - name: Verificar estrutura
        run: |
          grep -q "GUIA_PEDAGOGICO_MATERIAIS" public/app.js
          grep -q "PDFs de Metodologia" public/app.js
          grep -q "Slides por Módulo" public/app.js
          grep -q "Área exclusiva do Professor" public/app.js
      - name: Commit funcional
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js
          git commit -m "Implanta Guia Pedagógico exclusivo do Professor"
          git push