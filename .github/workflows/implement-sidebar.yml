name: Implantar Menu Lateral
on:
  push:
    paths:
      - '.github/workflows/implement-sidebar.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/implement_sidebar.py
      - run: node --check public/app.js
      - run: |
          grep -q "app-shell" public/app.js
          grep -q "side-group-title" public/index.html
          grep -q "btn-sidebar-toggle" public/app.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/index.html
          git commit -m "Implanta menu lateral responsivo"
          git push