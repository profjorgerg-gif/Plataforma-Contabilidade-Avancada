name: Implantar auditoria completa
on:
  push:
    paths:
      - '.github/workflows/implement-audit-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar auditoria
        run: python .github/scripts/implement_audit_v2.py
      - name: Validar JavaScript
        run: node --check public/app.js
      - name: Commit funcional
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js firestore.rules
          git commit -m "Implanta auditoria pedagógica e log de acessos"
          git push