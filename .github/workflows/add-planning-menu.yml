name: Adicionar menu de planejamento
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-planning-menu.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Aplicar atualização
        run: python .github/scripts/add_planning_menu.py
      - name: Validar JavaScript
        run: node --check public/app.js
      - name: Commit funcional
        run: |
          git config user.name 'Projetos Pedagogicos'
          git config user.email 'profjorge.rg@gmail.com'
          git add public/app.js firestore.rules
          git diff --cached --quiet && exit 0
          git commit -m 'Inclui planejamento semestral e plano de aula'
          git push origin main
