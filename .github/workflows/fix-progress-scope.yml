name: Corrigir progresso e escopo por professor

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-progress-scope.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar correções
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/app.js')
          s = p.read_text(encoding='utf-8')

          old = """        contentRead:false,\n        exerciseListsDone: new Array(m.exerciseLists.length).fill(false),\n        quizScore:null, quizTotal: m.quiz.length,\n        recoveryScore:null, recoveryTotal: m.recovery.length\n"""
          new = """        contentRead:false,\n        exerciseListsDone: new Array(m.exerciseLists.length).fill(false),\n        exerciseScores: new Array(m.exerciseLists.length).fill(null),\n        quizScore:null, quizTotal: m.quiz.length,\n        recoveryScore:null, recoveryTotal: m.recovery.length,\n        correction:{ status:'liberado', submittedAt:null, reviewedAt:null, feedback:'', finalGrade:null, released:false, history:[] }\n"""
          if old not in s:
              raise SystemExit('Bloco emptyProgress não encontrado')
          s = s.replace(old, new, 1)

          marker = """  function overallPct(progress){\n    if (!progress) return 0;\n    const vals = MODULES.map(m => pctModule(progress.modules[m.id], m));\n    return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);\n  }\n"""
          addition = marker + """  function professorRoster(roster){\n    const source = roster || state.roster || [];\n    if (!state.user || state.user.role !== 'professor') return source;\n    const names = new Set();\n    (state.turmas || []).forEach(t => (t.students || []).forEach(a => {\n      const n = (a.nome || '').trim().toLocaleLowerCase('pt-BR');\n      if (n) names.add(n);\n    }));\n    return source.filter(st => names.has((st.name || '').trim().toLocaleLowerCase('pt-BR')));\n  }\n"""
          if marker not in s:
              raise SystemExit('Marcador overallPct não encontrado')
          s = s.replace(marker, addition, 1)

          s = s.replace("""    const roster = await loadRoster();\n    roster.forEach(st => MODULES.forEach(m => {\n""", """    const allRoster = await loadRoster();\n    const roster = professorRoster(allRoster);\n    roster.forEach(st => MODULES.forEach(m => {\n""", 1)

          s = s.replace("""    const roster = state.roster || [];\n    let html = `<div class=\"note\">Notas por módulo:""", """    const roster = professorRoster(state.roster || []);\n    let html = `<div class=\"note\">Notas por módulo:""", 1)

          s = s.replace("""    (state.roster||[]).forEach(st=>{let vals=[], rel=[];""", """    professorRoster(state.roster||[]).forEach(st=>{let vals=[], rel=[];""", 1)

          s = s.replace("""const alunos=(state.roster||[]).filter(r=>names.size===0||names.has((r.name||'').trim()));""", """const alunos=(state.roster||[]).filter(r=>names.has((r.name||'').trim()));""", 1)

          p.write_text(s, encoding='utf-8')
      - name: Validar JavaScript
        run: node --check public/app.js
      - name: Commit e limpeza
        shell: bash
        run: |
          rm -f .github/workflows/fix-progress-scope.yml
          git config user.name "Projetos Pedagogicos"
          git config user.email "profjorge.rg@gmail.com"
          git add -A
          git commit -m "Corrige progresso inicial e escopo das notas por professor"
          git push origin HEAD:main
