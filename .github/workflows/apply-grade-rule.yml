name: Aplicar regra de notas por exercício

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-grade-rule.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar regra e tela de notas
        run: python .github/scripts/apply_grade_rule.py

      - name: Validar JavaScript alterado
        run: node --check public/app.js

      - name: Commit da atualização
        shell: bash
        run: |
          git config user.name "Projetos Pedagógicos"
          git config user.email "profjorge.rg@gmail.com"
          git add public/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Exibe notas por exercício e aplica recuperação substitutiva"
          git push origin main
