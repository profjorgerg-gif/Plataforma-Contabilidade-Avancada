name: Atualizar cadastros do planejamento
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-planning-catalog.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Aplicar atualização
        run: python .github/scripts/update_planning_catalog.py
      - name: Validar JavaScript
        run: node --check public/app.js
      - name: Commit funcional
        run: |
          git config user.name 'Projetos Pedagogicos'
          git config user.email 'profjorge.rg@gmail.com'
          git add public/app.js public/index.html README.md
          git diff --cached --quiet && exit 0
          git commit -m 'Integra cadastros e ajusta layout do planejamento'
          git push origin main
