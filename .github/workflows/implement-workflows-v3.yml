name: Implantar fluxos administrativos v3
on:
  push:
    paths:
      - '.github/workflows/implement-workflows-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar alterações
        run: python .github/scripts/implement_workflows_v3.py
      - name: Validar JavaScript
        run: node --check public/app.js
      - name: Verificar marcadores críticos
        run: |
          grep -q "Imprimir selecionados / PDF" public/app.js
          grep -q "Exclusão completa de turma" public/app.js
          grep -q "function moduleAccess" public/app.js
          grep -q "cycle:c.cycle" public/app.js
      - name: Commit funcional
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js
          git commit -m "Implanta fluxos administrativos completos"
          git push