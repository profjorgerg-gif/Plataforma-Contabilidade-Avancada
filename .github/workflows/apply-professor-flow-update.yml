name: Aplicar atualizacao pedagogica do professor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-professor-flow-update.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Corrigir executor temporario
        run: sed -i "s/re.subn(pattern, repl, s, count=1, flags=flags)/re.subn(pattern, lambda m: repl, s, count=1, flags=flags)/" .github/scripts/apply_professor_flow_update.py

      - name: Aplicar atualizacao
        run: python .github/scripts/apply_professor_flow_update.py

      - name: Validar JavaScript
        run: node --check public/app.js

      - name: Commit da atualizacao funcional
        run: |
          git config user.name 'Projetos Pedagogicos'
          git config user.email 'profjorge.rg@gmail.com'
          git add public/app.js README.md
          git diff --cached --quiet && exit 0
          git commit -m 'Automatiza fluxo de notas e atualiza painel do professor'
          git push origin main
