name: Aplicar recuperacao em todas as atividades

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-recovery-all.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Atualizar regra de recuperacao e exibicao das notas
        run: python .github/scripts/apply_recovery_all.py

      - name: Validar JavaScript
        run: node --check public/app.js

      - name: Commit da atualizacao
        run: |
          git config user.name 'Projetos Pedagogicos'
          git config user.email 'profjorge.rg@gmail.com'
          git add public/app.js README.md
          git diff --cached --quiet && exit 0
          git commit -m 'Aplica recuperação a exercícios e quiz'
          git push origin main
