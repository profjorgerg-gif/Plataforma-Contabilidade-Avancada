name: Aplicar controle de liberação individual

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-release-control-update.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar atualização
        run: python .github/scripts/apply_release_control_update.py

      - name: Validar JavaScript
        run: node --check public/app.js

      - name: Commit da atualização funcional
        run: |
          git config user.name 'Projetos Pedagogicos'
          git config user.email 'profjorge.rg@gmail.com'
          git add public/app.js README.md
          git diff --cached --quiet && exit 0
          git commit -m 'Exige recuperação e controla liberação individual'
          git push origin main
