name: Implantar manual operacional e checklist
on:
  push:
    paths:
      - '.github/workflows/implant-manual-operacional-checklist.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar alterações
        run: python .github/scripts/implant_manual_operacional_checklist.py
      - name: Validar JavaScript
        run: node --check public/app.js
      - name: Commit das alterações
        run: |
          git config user.name "Projetos Pedagogicos"
          git config user.email "profjorge.rg@gmail.com"
          git add public/app.js README.md
          git diff --cached --quiet || git commit -m "Implanta manual operacional e checklist de status"
          git push