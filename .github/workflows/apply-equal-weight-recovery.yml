name: Ajustar media das seis atividades

on:
  push:
    paths:
      - '.github/workflows/apply-equal-weight-recovery.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Aplicar nova regra de media e recuperacao
        run: python .github/scripts/apply_equal_weight_recovery.py
      - name: Validar JavaScript
        run: node --check public/app.js
      - name: Commit
        run: |
          git config user.name 'Projetos Pedagogicos'
          git config user.email 'profjorge.rg@gmail.com'
          git add public/app.js
          git commit -m 'Refaz media das seis atividades e regra da recuperacao'
          git push
