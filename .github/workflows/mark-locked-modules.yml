name: Identificar módulos bloqueados
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mark-locked-modules.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Aplicar ajuste visual
        run: python .github/scripts/mark_locked_modules.py
      - name: Validar JavaScript
        run: node --check public/app.js
      - name: Commit funcional
        run: |
          git config user.name 'Projetos Pedagogicos'
          git config user.email 'profjorge.rg@gmail.com'
          git add public/app.js
          git diff --cached --quiet && exit 0
          git commit -m 'Identifica módulos bloqueados e próxima liberação'
          git push origin main
