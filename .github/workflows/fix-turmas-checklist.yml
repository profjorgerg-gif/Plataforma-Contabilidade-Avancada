name: Corrigir Turmas e Checklist
on:
  push:
    paths:
      - '.github/workflows/fix-turmas-checklist.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_turmas_checklist.py
      - run: node --check public/app.js
      - run: |
          grep -q "function renderTurmasSection" public/app.js
          grep -q "function renderChecklistStatus" public/app.js
          grep -q "btn-export-checklist" public/app.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js
          git commit -m "Corrige menus Turmas e Checklist"
          git push